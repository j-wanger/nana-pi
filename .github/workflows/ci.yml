name: ci
# contract (R-3938, R-3944): feature pushes own CI even when PR mergeability blocks PR events.
run-name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feat/') && 'ci (duplicate feature PR)' || 'ci' }}
on:
  push:
    branches: [main, 'feat/**']
  pull_request:

# contract (R-3938): cancel superseded lane tips, never a main push; event groups do not race each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref != 'refs/heads/main' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # chosen 2026-10-23 (R-2711, R-2716): 1.4.0 is the supported ceiling; both CI probes passed.
  PI_VERSION: 1.4.0
  # measured 2026-10-23 (R-1091): the scratch install moment of pi 1.4.0; npm --before at this
  # time reproduced that install's `npm ls -g --all` exactly (262 lines). Move it with PI_VERSION.
  PI_BEFORE: "2026-10-23T18:35:54Z"
  # chosen 2026-10-23 (R-2711, R-2712, R-2716): 1.0.3 is the supported floor; both CI probes passed.
  PI_FLOOR_VERSION: 1.0.3
  # measured 2026-10-23 (R-2712): inside pi 1.0.3's lockstep publish window; a scratch install
  # resolved all six scoped pi dependencies at 1.0.3. Move it with PI_FLOOR_VERSION.
  PI_FLOOR_BEFORE: "2026-10-05T08:40:00Z"

jobs:
  lane-selection:
    if: ${{ github.ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'feat/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: select
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          // lane selection begin
          import fs from 'node:fs';
          import { TEST_PACKS } from './packages/nana-pack/lib/test-packs-config.mjs';
          import { selectPackFiles } from './scripts/test-packs.mjs';
          const files = Object.keys(TEST_PACKS).filter(file => file.endsWith('.test.mjs') && fs.existsSync(file));
          const selected = await selectPackFiles({root:process.cwd(),files,packs:['land','module'],changedFrom:'origin/main'});
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `selected=${selected.files.length > 0}\n`);
          // lane selection end
          NODE

  install-check:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'feat/') }}
    strategy:
      fail-fast: false
      matrix:
        # contract (R-3824, R-3942): Windows install checks run only on main pushes.
        os: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '["macos-latest","windows-latest"]' || '["macos-latest"]') }}
        pi: [ceiling, floor]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g --ignore-scripts @earendil-works/pi-coding-agent@${PI_VERSION} --before="${PI_BEFORE}"
        if: matrix.pi == 'ceiling'
      - name: Verify ceiling pi version
        if: matrix.pi == 'ceiling'
        run: test "$(pi --version)" = "${PI_VERSION}"
      - run: npm i -g --ignore-scripts @earendil-works/pi-coding-agent@${PI_FLOOR_VERSION} --before="${PI_FLOOR_BEFORE}"
        if: matrix.pi == 'floor'
      - name: Verify floor pi version
        if: matrix.pi == 'floor'
        run: test "$(pi --version)" = "${PI_FLOOR_VERSION}"
      - name: Install check
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node packages/nana-setup/bin/install-check.mjs

  suite:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'feat/') }}
    name: suite (${{ matrix.leg }})
    outputs:
      shard1: ${{ steps.shard-result.outputs.shard1 }}
      shard2: ${{ steps.shard-result.outputs.shard2 }}
      shard3: ${{ steps.shard-result.outputs.shard3 }}
    strategy:
      fail-fast: false
      matrix:
        # chosen 2026-11-07 (R-3817): three shards from the plan's measured Windows
        # 1,790–1,860 s at four jobs; ideal 597–620 s leaves room below 20 min for skew.
        # contract (R-3824, R-3942): lane events allocate no whole-suite Windows shards.
        include: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '[{"os":"macos-latest","leg":"macos-latest","shard":""},{"os":"ubuntu-latest","leg":"ubuntu-latest","shard":""},{"os":"windows-latest","leg":"windows-latest-shard-1-of-3","shard":"1/3"},{"os":"windows-latest","leg":"windows-latest-shard-2-of-3","shard":"2/3"},{"os":"windows-latest","leg":"windows-latest-shard-3-of-3","shard":"3/3"}]' || '[{"os":"macos-latest","leg":"macos-latest","shard":""},{"os":"ubuntu-latest","leg":"ubuntu-latest","shard":""}]') }}
    runs-on: ${{ matrix.os }}
    # chosen 2026-10-20 (R-2061): 90 minutes, not GitHub's 360-minute default, so a hung leg stops
    # within 90 minutes. Measured job wall times, every CI run from 2026-10-16 to 2026-10-20: slowest
    # finished Windows leg 34.5 min (run 39298256239), macOS 18.7, Linux 14.5. Windows grew about
    # 5 minutes a day on 2026-10-19 and 2026-10-20 as tests landed. About 2.6 times the slowest leg,
    # so suite growth and runner variance do not cancel an honest leg; a false time-out blocks release.
    # Suite legs run four files at a time since this lane.
    timeout-minutes: 90
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    env: &suite-env
      NANA_TEST_REQUIRE_COPIER: "1"
      # chosen; measured clean at 4 against 1 in probe run 39761155058
      NANA_CI_JOBS: "4"
      # chosen; about twice review-ledger's projected 412 s at four on Windows (runs 39731735341 and 39761155058)
      NANA_TEST_TIMEOUT_MS: "900000"
      # chosen: one stable name in each leg's temporary folder, outside the checkout
      NANA_CI_RECORD_NAME: "nana-suite-record.json"
      # contract (R-3820): report-only 20-minute warning; measured per shard, not summed.
      NANA_CI_SHARD_MAX_SECONDS: "1200"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - run: uvx copier --version
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: npm i -g @earendil-works/pi-coding-agent@${PI_VERSION} --before="${PI_BEFORE}"
      - name: Verify pi version
        run: test "$(pi --version)" = "${PI_VERSION}"
      # test-retire plan: one blocking direct run per workflow, not child checks inside tests.
      - name: Repository checks
        if: matrix.os == 'macos-latest'
        run: |
          npm run map:check
          npm run readme:check
          node scripts/requirements-trace.mjs
          node scripts/requirements-tree.mjs --check
      # contract (R-3853, R-3857): retire stays on main; lanes add individually selected release files.
      - run: npm test -- --jobs=${{ env.NANA_CI_JOBS }} --pack=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'land,main,module,retire' || 'land,module' }} ${{ github.ref != 'refs/heads/main' && '--changed-from=origin/main' || '' }}
        if: matrix.os != 'windows-latest'
        env:
          NANA_SUITE_RECORD_FILE: ${{ runner.temp }}/${{ env.NANA_CI_RECORD_NAME }}
      - run: npm test -- --verbose --jobs=${{ env.NANA_CI_JOBS }} --shard=${{ matrix.shard }} --pack=land,main,module,retire
        if: matrix.os == 'windows-latest'
        env:
          NANA_SUITE_RECORD_FILE: ${{ runner.temp }}/${{ env.NANA_CI_RECORD_NAME }}
      - name: Report Windows shard wall time
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        env:
          NANA_SUITE_RECORD_FILE: ${{ runner.temp }}/${{ env.NANA_CI_RECORD_NAME }}
        run: |
          node --input-type=module <<'NODE'
          // win-shards wall check begin
          import fs from "node:fs";
          const record = JSON.parse(fs.readFileSync(process.env.NANA_SUITE_RECORD_FILE, "utf8"));
          const seconds = record.wallSeconds;
          const line = `Windows shard ${record.shard?.index}/${record.shard?.count}: ${seconds}s`;
          console.log(line);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${line}\n`);
          if (!Number.isFinite(seconds) || seconds < 0) console.log("::warning::Windows shard wall time is unavailable or invalid");
          else if (seconds >= Number(process.env.NANA_CI_SHARD_MAX_SECONDS)) console.log(`::warning::${line} exceeds the report-only wall-time bound`);
          // win-shards wall check end
          NODE
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: suite-record-${{ matrix.leg }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.NANA_CI_RECORD_NAME }}
      - name: Record successful Windows shard
        id: shard-result
        if: ${{ success() && matrix.os == 'windows-latest' }}
        env:
          SHARD: ${{ matrix.shard }}
        run: echo "shard${SHARD%%/*}=success" >> "$GITHUB_OUTPUT"

  windows-selected:
    needs: [lane-selection]
    if: ${{ needs.lane-selection.outputs.selected == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env: *suite-env
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - run: uvx copier --version
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: npm i -g @earendil-works/pi-coding-agent@${PI_VERSION} --before="${PI_BEFORE}"
      - name: Verify pi version
        run: test "$(pi --version)" = "${PI_VERSION}"
      # contract (R-3943): identical lane selector to macOS; never full-suite Windows shards.
      - run: npm test -- --jobs=${{ env.NANA_CI_JOBS }} --pack=land,module --changed-from=origin/main
        env:
          NANA_SUITE_RECORD_FILE: ${{ runner.temp }}/${{ env.NANA_CI_RECORD_NAME }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: suite-record-windows-selected-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.NANA_CI_RECORD_NAME }}

  release:
    needs: [suite, install-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.suite.result == 'success' && needs.install-check.result == 'success' && needs.suite.outputs.shard1 == 'success' && needs.suite.outputs.shard2 == 'success' && needs.suite.outputs.shard3 == 'success'
    permissions:
      contents: write
    concurrency:
      group: template-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: npm i -g @earendil-works/pi-coding-agent@${PI_VERSION} --before="${PI_BEFORE}"
      - name: Verify pi version
        run: test "$(pi --version)" = "${PI_VERSION}"
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: npm run release -- --push
