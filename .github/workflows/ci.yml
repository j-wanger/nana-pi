name: ci
on:
  pull_request:

permissions:
  contents: read

env:
  PI_VERSION: 1.0.2
  PI_BEFORE: "2026-10-04T06:57:57Z"

jobs:
  probe-p1:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @earendil-works/pi-coding-agent@${PI_VERSION} --before="${PI_BEFORE}"
      - name: P1 step 1 (in-process thread culture de-DE)
        run: |
          powershell -NoProfile -Command '& { [System.Threading.Thread]::CurrentThread.CurrentCulture = [System.Globalization.CultureInfo]::GetCultureInfo(1031); [double]1.5 | Out-String; (Get-Process -Id $PID).CPU | Out-String; (Get-Process -Id $PID).TotalProcessorTime.Ticks | Out-String }'
      - name: P1 step 1b (same in pwsh 7)
        run: |
          pwsh -NoProfile -Command '& { [System.Threading.Thread]::CurrentThread.CurrentCulture = [System.Globalization.CultureInfo]::GetCultureInfo(1031); [double]1.5 | Out-String; (Get-Process -Id $PID).CPU | Out-String; (Get-Process -Id $PID).TotalProcessorTime.Ticks | Out-String }'
      - name: P1 step 0 (user culture before)
        run: |
          powershell -NoProfile -Command '(Get-Culture).Name; $PSVersionTable.PSVersion.ToString(); (Get-Process -Id $PID).CPU; (Get-Process -Id $PID).TotalProcessorTime.Ticks'
      - name: P1 step 2 (Set-Culture de-DE)
        run: |
          powershell -NoProfile -Command 'Set-Culture de-DE'
      - name: P1 step 3 (new process under the user culture)
        run: |
          powershell -NoProfile -Command '(Get-Culture).Name; $PSVersionTable.PSVersion.ToString(); (Get-Process -Id $PID).CPU; (Get-Process -Id $PID).TotalProcessorTime.Ticks'
      - name: P1 step 3b (the exact read pi-watchdog runs today)
        run: |
          powershell -NoProfile -Command "(Get-Process -Id $$).CPU" || true
      - name: P1 step 4 (win32-launch under de-DE, the lane tip's watchdog)
        run: npm test -- packages/nana-pack/tests/win32-launch.test.mjs --verbose
      - name: P1 step 5 (watchdog-cpu under de-DE, the lane tip)
        run: npm test -- packages/nana-pack/tests/watchdog-cpu.test.mjs --verbose
