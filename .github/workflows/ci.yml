name: ci
on:
  pull_request:

permissions:
  contents: read

env:
  PI_VERSION: 1.0.2
  PI_BEFORE: "2026-10-04T06:57:57Z"

jobs:
  mutation-runner-windows:
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4, 5, 6]
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @earendil-works/pi-coding-agent@${PI_VERSION} --before="${PI_BEFORE}"
      - name: mutation-runner.test.mjs, twice in a row
        run: |
          for i in 1 2; do npm test -- packages/nana-pack/tests/mutation-runner.test.mjs --verbose 2>&1 | grep -E "contending child|transient lock|never releases|release|files: |FAIL" || true; done
