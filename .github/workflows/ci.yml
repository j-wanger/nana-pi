name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # chosen 2026-10-23 (R-2711, R-2716): 1.4.0 is the supported ceiling; both CI probes passed.
  PI_VERSION: 1.4.0
  # measured 2026-10-23 (R-1091): the scratch install moment of pi 1.4.0; npm --before at this
  # time reproduced that install's `npm ls -g --all` exactly (262 lines). Move it with PI_VERSION.
  PI_BEFORE: "2026-10-23T18:35:54Z"
  # chosen 2026-10-23 (R-2711, R-2712, R-2716): 1.0.3 is the supported floor; both CI probes passed.
  PI_FLOOR_VERSION: 1.0.3
  # measured 2026-10-23 (R-2712): inside pi 1.0.3's lockstep publish window; a scratch install
  # resolved all six scoped pi dependencies at 1.0.3. Move it with PI_FLOOR_VERSION.
  PI_FLOOR_BEFORE: "2026-10-05T08:40:00Z"

jobs:
  # SEAT SCRATCH (never merged): lane win-test-limits' Windows-only wrong-code pairs 14 to 16 (R-2884).
  win-pairs:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      NANA_TEST_REQUIRE_COPIER: "1"
      NANA_TEST_TIMEOUT_MS: "900000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - run: uvx copier --version
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: npm i -g @earendil-works/pi-coding-agent@${PI_VERSION} --before="${PI_BEFORE}"
      - name: Verify pi version
        run: test "$(pi --version)" = "${PI_VERSION}"
      - name: Point main at origin/main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main
      - name: SEAT SCRATCH - Windows pairs 14 to 16 for win-test-limits
        run: |
          export npm_execpath="$(node -p "require('path').join(require('path').dirname(process.execPath), 'node_modules', 'npm', 'bin', 'npm-cli.js')")"
          echo "npm_execpath=$npm_execpath"; test -f "$npm_execpath"
          set +e
          node win-pairs.mjs win-table.mjs 2>&1 | tee win-pairs-output.txt
          set -e
          grep -q "RESULT: 3/3 red" win-pairs-output.txt
