<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nana pi product ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#f4f2ec;--fg:#20231f;--panel:#fff;--line:#d8d7cf;--accent:#326b58;--status-implemented:#4e9a73;--status-untested:#d4a72c;--status-planned:#7689c4;--status-violated:#d66b5d;--status-retired:#8b9090}html[data-theme="dark"]{--bg:#171b19;--fg:#e6e9e4;--panel:#222825;--line:#434a45;--accent:#86c4a3;--status-implemented:#65b687;--status-untested:#e0bd54;--status-planned:#91a4df;--status-violated:#ed887a;--status-retired:#a3aaaa}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b19;--fg:#e6e9e4;--panel:#222825;--line:#434a45;--accent:#86c4a3;--status-implemented:#65b687;--status-untested:#e0bd54;--status-planned:#91a4df;--status-violated:#ed887a;--status-retired:#a3aaaa}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 'DM Sans',sans-serif}main{max-width:1100px;margin:auto;padding:2rem 1.25rem}h1,h2{line-height:1.2}h1{color:var(--accent)}article{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem;margin:1rem 0}.tabs{display:flex;flex-wrap:wrap;gap:.4rem;padding:1rem 0;border-bottom:1px solid var(--line)}.tabs a{padding:.55rem .9rem;border-radius:999px;text-decoration:none}.tabs a[aria-current="page"]{background:var(--accent);color:var(--panel);font-weight:700}a{color:var(--accent)}input,select{font:inherit;padding:.5rem;margin:.4rem}.counts{display:flex;align-items:center;gap:.8rem;margin:.65rem 0}.status-bar{display:flex;flex:0 0 120px;height:12px;overflow:hidden;border-radius:99px;background:var(--line)}.status-segment{min-width:0}.status-implemented,.status-pill.status-implemented{background:var(--status-implemented)}.status-untested,.status-pill.status-untested{background:var(--status-untested)}.status-planned,.status-pill.status-planned{background:var(--status-planned)}.status-violated,.status-pill.status-violated{background:var(--status-violated)}.status-retired,.status-pill.status-retired{background:var(--status-retired)}.count-label{margin:0;font-size:.85rem}.status-pill{display:inline-block;padding:.1rem .55rem;border-radius:999px;color:#17201a;font-size:.75rem;font-weight:700;vertical-align:middle}.row-heading{display:flex;align-items:center;gap:.5rem;margin:.1rem 0 .6rem}.row-text{margin:.3rem 0}.row-evidence{margin:.3rem 0 0;font: .8rem/1.45 'DM Mono',monospace;overflow-wrap:anywhere;color:var(--accent)}.assessment-badge{display:inline-block;padding:.2rem .7rem;border:1px solid var(--line);border-radius:999px;font-weight:700}.state-current{color:var(--status-implemented)}.state-out-of-date{color:var(--status-untested)}.state-unassessed{color:var(--status-retired)}.feature-status{font-size:.75rem;margin-left:.6rem;padding:.15rem .5rem;border:1px solid var(--line);border-radius:999px}@media(max-width:600px){main{padding:1rem .75rem}body{overflow-wrap:anywhere}.counts{align-items:flex-start;flex-direction:column}.status-bar{flex-basis:10px;width:100%}.row-evidence{overflow-wrap:anywhere;word-break:break-word}}
</style>
</head>
<body><main id="report"></main>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
const renderInto = (__RENDERER__);
const data = JSON.parse(document.getElementById("report-data").textContent);
renderInto(document, data, { hash: location.hash });
addEventListener("hashchange", () => { renderInto(document, data, { hash: location.hash }); window.scrollTo(0, 0); });
</script>
</body>
</html>
