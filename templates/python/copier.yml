_subdirectory: template
_min_copier_version: "9.0.0"

project_name:
  type: str
  help: Project name (human-readable)

project_slug:
  type: str
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  help: Distribution name (kebab-case, used in pyproject)

package_name:
  type: str
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"
  help: Import package name (snake_case, lives under src/)

description:
  type: str
  default: ""
  help: One-line project description

adopt:
  type: bool
  default: false
  help: Applying to an EXISTING project? (skips the README/src/tests starters — drive this via the adopt-py skill)

_message_after_copy: |
  {% if adopt -%}
  {{ project_name }}: nana stack overlaid (adopt mode — configs only, source tree untouched).

  Now reconcile from `git diff`: merge your [project] metadata/deps back into
  pyproject, union .gitignore, fix layout paths if not src/, stage the
  strictness (see the adopt-py skill), then commit including .copier-answers.yml.
  {%- else -%}
  {{ project_name }} scaffolded.

  Next steps:
    cd into the project, then:
      git init && git add -A && git commit -m "scaffold"
      uv sync
      uv run pre-commit install
      uv run pytest
  {%- endif %}

  This project tracks its template: `uvx copier update` re-syncs it later.
