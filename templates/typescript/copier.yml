_subdirectory: template
_min_copier_version: "9.0.0"

project_name:
  type: str
  help: Project name (human-readable)

project_slug:
  type: str
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  help: Package name (kebab-case, used in package.json)

description:
  type: str
  default: ""
  help: One-line project description

adopt:
  type: bool
  default: false
  help: Applying to an EXISTING project? (skips the README/src/tests starters — drive this via the adopt-ts skill)

_message_after_copy: |
  {% if adopt -%}
  {{ project_name }}: nana stack overlaid (adopt mode — configs only, source tree untouched).

  Now reconcile from `git diff`: merge your package.json fields/deps with the
  pinned scripts + devDeps, keep YOUR package manager, adapt CI to it, stage
  the strictness (see the adopt-ts skill), then commit including .copier-answers.yml.
  {%- else -%}
  {{ project_name }} scaffolded.

  Next steps:
    cd into the project, then:
      git init && git add -A && git commit -m "scaffold"
      pnpm install
      pnpm check        # typecheck + lint + test
      git add pnpm-lock.yaml && git commit -m "lockfile"
  {%- endif %}

  This project tracks its template: `uvx copier update` re-syncs it later.
