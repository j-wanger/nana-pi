<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nana pi · The hive</title>
<style>
:root{color-scheme:light dark;--bg:#f4f2ec;--fg:#20231f;--panel:#fff;--line:#d8d7cf;--accent:#326b58;--honey:#e6a83c} @media(prefers-color-scheme:dark){:root{--bg:#171b19;--fg:#e6e9e4;--panel:#222825;--line:#434a45;--accent:#86c4a3}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 'DM Sans',system-ui,sans-serif}a{color:var(--accent)}header{padding:2rem 4vw 1rem;display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;border-bottom:1px solid var(--line)}h1{font-size:clamp(2.4rem,6vw,5rem);font-weight:600;line-height:1;margin:.3rem 0;letter-spacing:-.06em}header p{max-width:28rem;margin:.5rem 0}.eyebrow,.renderer-line,.rail,.scene-caption{font:12px/1.6 'DM Mono',monospace;letter-spacing:.04em}.eyebrow{color:var(--accent);text-transform:uppercase}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,370px);gap:2rem;padding:2rem 4vw;max-width:1600px;margin:auto;align-items:start}.scene-wrap{position:sticky;top:1rem;min-width:0}.stage{position:relative;border:1px solid var(--line);background:#171b19;overflow:hidden;border-radius:3px;height:min(70vh,740px);min-height:280px}canvas{width:100%;height:100%;display:block;touch-action:pan-y}canvas.pixel{image-rendering:pixelated;object-fit:contain}.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}.label{position:absolute;color:#e6e9e4;font:10px/1.2 'DM Mono',monospace;white-space:nowrap;transform:translate(-50%,-100%);padding:4px 6px;border-left:1px solid #86c4a3;background:#171b19d9}.label::after{content:'';height:18px;border-left:1px solid #86c4a3;position:absolute;left:50%;top:100%}.scene-caption{display:flex;justify-content:space-between;gap:1rem;color:var(--accent);padding:.6rem 0}.scene-caption a{white-space:nowrap}.rail{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 1.6rem}.rail a{border:1px solid var(--line);padding:.4rem .6rem;text-decoration:none}.rail a::before{content:'□ ';color:var(--honey)}.rail a[aria-current]{border-color:var(--accent);background:var(--panel)}.card{background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(16px);border:1px solid var(--line);padding:1.3rem;margin:1rem 0;border-radius:4px;overflow-wrap:anywhere}.card.active{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.card h2{font-size:1.4rem;line-height:1.2;margin:0 0 1rem;letter-spacing:-.025em}.card p{white-space:pre-line;font-size:.9rem;margin:0;line-height:1.8}.renderer-line{color:var(--accent);margin:0}footer{padding:1rem 4vw 3rem;border-top:1px solid var(--line);font-size:.8rem}#stories{display:flex;flex-direction:column;min-width:0}#stories .renderer-line{order:0}#stories .rail{order:1}#stories .card{order:4}#stories .landing{order:3}#stories .card.active{order:2}button{font:inherit}a:focus-visible{outline:3px solid var(--honey);outline-offset:3px}#error{white-space:pre-line;color:var(--fg)}
@media(max-width:760px){header{padding:1.4rem 1rem}header p{font-size:.9rem}main{display:block;padding:1rem}.scene-wrap{position:relative;top:0}.stage{height:55svh;max-height:60svh;min-height:240px}.scene-caption{font-size:10px}.card{padding:1.1rem}.label{font-size:8px;padding:2px}.rail{gap:.4rem}footer{padding:1rem}}
</style>
</head>
<body>
<header><div><span class="eyebrow">Nana pi / a living system</span><h1>The hive.</h1></div><p>A place for every moving part.<br>See what is built, what is missing, and what needs a decision.</p></header>
<main><section class="scene-wrap" aria-label="Interactive component hive"><div class="stage"><canvas aria-label="Component hive; use the component links for the same information"></canvas><div class="labels" aria-hidden="true"></div></div><div class="scene-caption"><span>TURN · TAP · EXPLORE</span><a href="?view=pixel">Pixel view</a><a href="?still">Hold still</a></div><p id="error" role="alert"></p></section><section id="stories" aria-label="Component stories"><p>Loading the hive…</p></section></main>
