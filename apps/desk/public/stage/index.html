<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stage</title>
<script>
	// theme before first paint (same key as the desk)
	try { const t = localStorage.getItem("pi-desk-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/stage.css">
</head>
<body class="stage-body">

<!-- GATE BAR: host invariant. Pending extension dialogs render here, above everything,
     and it can never be folded away with the drawer. -->
<div id="gate-bar" hidden></div>

<header id="top">
	<div class="brand"><span id="app-title">stage</span><span id="app-cwd" class="dim"></span></div>
	<div class="top-right">
		<span id="chip" class="chip">…</span>
	</div>
</header>

<main id="main">
	<section id="stage">
		<div id="slot-main" class="slot"></div>
		<aside id="slot-side" class="slot" hidden></aside>
		<div id="empty" class="empty">
			<div class="empty-title">nothing on stage yet</div>
			<div class="empty-sub">ask for something, or start with one of these</div>
			<div class="quick" id="quick"></div>
		</div>
	</section>

	<aside id="drawer" class="collapsed">
		<div id="turns"></div>
		<div id="composer">
			<textarea id="input" rows="2" placeholder="ask the agent… (Enter to send, Shift+Enter for a newline)"></textarea>
			<div class="composer-row">
				<span id="hint" class="dim"></span>
				<button id="btn-abort" class="btn quiet" hidden>stop</button>
				<button id="btn-send" class="btn primary">send</button>
			</div>
		</div>
	</aside>
</main>

<!-- the chat bubble: a floating button; the drawer above opens over the page (⌘J, Esc closes) -->
<button id="btn-drawer" class="btn" title="chat with the agent (⌘J)" aria-controls="drawer" aria-expanded="false"><span id="drawer-label">chat</span><span id="drawer-badge" hidden>0</span></button>

<div id="modal-slot" hidden></div>
<div id="toasts"></div>

<script type="module" src="/stage.js"></script>
</body>
</html>
